## can0
[mcu can0]
canbus_uuid: d11bf6bdc3a0 # run the following command to locate the uuid >   ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
## can0
[temperature_sensor CANBOARD]
sensor_type: temperature_mcu
sensor_mcu: can0

[extruder]
step_pin: can0:PD0
dir_pin: !can0:PD1
enable_pin: !can0:PD2
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: can0:PB13
sensor_type: Generic 3950
sensor_pin: can0:PA3
max_extrude_cross_section: 30
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
gear_ratio: 50:10
rotation_distance: 23.700
control: pid
pid_Kp:45.140 
pid_Ki:10.377 
pid_Kd:49.091
min_temp: 0
max_temp: 300
min_extrude_temp: 0
pressure_advance: 0.02                                          
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: can0:PA15
run_current: 0.6
driver_TPOWERDOWN: 20
stealthchop_threshold: 0

[fan_generic T0_partfan]
pin: can0:PA0

[heater_fan T0_hotend_fan]
pin: can0:PA1
heater: extruder
heater_temp: 50.0
max_power: 1.0
shutdown_speed: 0

[adxl345]
cs_pin: can0:PB12
spi_software_sclk_pin: can0:PB10
spi_software_mosi_pin: can0:PB11
spi_software_miso_pin: can0:PB2
axes_map: x,y,z

[gcode_macro T0]
variable_color: ""
gcode:
  SELECT_TOOL T=0
  #{% if params.PRIME == '1' %}
  #  PRIME_NOZZLES TEMP={params.TEMP} 
  #{% else %}
  #
  #{% endif %}

[neopixel T0]
pin: can0:PD3
chain_count: 1
color_order: GRBW
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0
initial_WHITE: 1.0

[tool T0]
tool_number: 0
extruder: extruder
fan: T0_partfan
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
params_park_x: 9.5
params_park_y: 4
params_park_z: 296.5

[tool_probe T0]
pin: ^can0:PB6
tool: 0
lift_speed: 20
speed: 10
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder
