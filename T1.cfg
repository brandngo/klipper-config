## can1
[mcu can1]
canbus_uuid: 83c622482978 # run the following command to locate the uuid >   ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0

[temperature_sensor CANBOARD1]
sensor_type: temperature_mcu
sensor_mcu: can1

[extruder1]
step_pin: can1:PD0
dir_pin: can1:PD1
enable_pin: !can1:PD2
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: can1:PB13
sensor_type: Generic 3950
sensor_pin: can1:PA3
max_extrude_cross_section: 30
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
rotation_distance: 54.9
gear_ratio: 44:10, 37:17
control: pid
pid_Kp:14.068 
pid_Ki:0.738 
pid_Kd:67.001
min_temp: 0
max_temp: 300
min_extrude_temp: 0
pressure_advance: 0.02                                          
pressure_advance_smooth_time: 0.040

[tmc2209 extruder1]
uart_pin: can1:PA15
run_current: 0.6
driver_TPOWERDOWN: 20
stealthchop_threshold: 0

[fan_generic T1_partfan]
pin: can1:PA1

[heater_fan T1_hotend_fan]
pin: can1:PA0
heater: extruder1
max_power: 1.0 
kick_start_time: 0.5
heater_temp: 50.0
shutdown_speed: 0

[neopixel T1]
pin: can1:PD3
chain_count: 1
color_order: GRBW
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0
initial_WHITE: 1.0

#[adxl345]
#cs_pin: can1:ADXL_CS
#spi_software_sclk_pin: can1:ADXL_SCLK
#spi_software_mosi_pin: can1:ADXL_MOSI
#spi_software_miso_pin: can1:ADXL_MISO
#axes_map: x,y,z

[gcode_macro T1]
variable_color: ""
gcode:
  SELECT_TOOL T=1
  {% if params.PRIME == '1' %}
    PRIME_NOZZLES TEMP={params.TEMP} 
  {% else %}
    #_PARK_CLEAN
  {% endif %}

[tool T1]
tool_number: 1
extruder: extruder1
params_type: 'rods_mini_hookon'
fan: T1_partfan
params_park_x: 74.5
params_park_y: 3.5
params_park_z: 296.5

[tool_probe T1]
pin: ^can1:PB9
tool: 1
lift_speed: 20
speed: 10
samples: 3
samples_result: average
sample_retract_dist: 2.0
samples_tolerance: 0.05
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder1